[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mism-dev"
version = "0.1.0"
description = "Multi-mutation In Silico Saturation Mutagenesis (MISM) toolkit"
authors = [
    {name = "MISM Dev Team", email = "dev@example.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "torch>=1.9.0",
    "scikit-learn>=1.0.0",
    "h5py>=3.1.0",
    "pysam>=0.16.0",
    "tqdm>=4.60.0",
    "psutil>=5.8.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
ml = [
    "celer>=0.6.0",
    "pytorch-lightning>=1.5.0",
    "lightning-utilities",
]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]

[tool.setuptools.packages.find]
include = ["mism*"]
exclude = ["deprecated*", "scripts*", "__pycache__*", "*.ipynb_checkpoints*"]

[project.urls]
Homepage = "https://github.com/calico/multi-ism"
Repository = "https://github.com/calico/multi-ism"